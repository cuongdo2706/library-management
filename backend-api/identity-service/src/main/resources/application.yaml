spring:
  application:
    name: identity-service
  cloud:
    consul:
      discovery:
        health-check-path: /api/actuator/health
        prefer-ip-address: true
  data:
    redis:
      port: ${REDIS_DB_PORT}
  datasource:
    url: jdbc:postgresql://${POSTGRES_DB_HOST}:${POSTGRES_DB_PORT}/${POSTGRES_DB_NAME}
    username: ${POSTGRES_DB_USERNAME}
    password: ${POSTGRES_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_updates: true
        order_inserts: true
  threads:
    virtual:
      enabled: true
server:
  port: ${SERVER_PORT}
  servlet:
    context-path: /api
