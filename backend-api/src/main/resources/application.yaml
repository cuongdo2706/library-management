spring:
  application:
    name: backend-api
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
      jakarta:
        persistence:
          query:
            timeout: 3000
          lock:
            timeout: 5000
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
logging:
  level:
    org:
      springframework:
        security: TRACE
      hibernate:
        orm:
          core: ERROR
          connections:
            pooling: WARN
          jdbc:
            bind: TRACE
file:
  upload:
    base-dir: ${BASE_DIRECTORY}
    max-size: 10485760
    allowed-extensions: jpg,jpeg,png,webp
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000
server:
  servlet:
    context-path: /api/v1
  port: ${SERVER_PORT:8080}

